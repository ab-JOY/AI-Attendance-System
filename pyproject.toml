[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-attendance-system"
version = "0.1.0"
description = "Face-recognition attendance system (LBPH + MediaPipe FaceMesh)"
readme = "README.md"

# ---------------------------------------------------------------------------
# The upper bound is load-bearing, not cosmetic.
#
# mediapipe 0.10.14 publishes no wheels for Python 3.12 or later. Relaxing
# this to ">=3.11" lets `pip install` succeed on 3.12 and then fail at
# `import mediapipe`, which is a far worse failure mode. Do not widen it
# without first confirming a mediapipe release that supports the newer
# interpreter AND re-running the held-out evaluator.
# ---------------------------------------------------------------------------
requires-python = ">=3.11,<3.12"

# ---------------------------------------------------------------------------
# Every direct dependency is pinned to the exact version this system was
# measured against (PO-1). requirements.txt previously used ">=" for 5 of 7,
# so two installs a week apart could produce different behaviour with no
# change in the source tree.
#
# opencv-contrib-python (not opencv-python) is required: the LBPH recogniser
# lives in cv2.face, which ships only in contrib. train_model.py and
# recognize_face.py both guard on hasattr(cv2, "face") for this reason.
# ---------------------------------------------------------------------------
dependencies = [
    "Flask==3.1.3",
    "mysql-connector-python==26.7.0",
    "opencv-contrib-python==4.10.0.84",
    "mediapipe==0.10.14",
    # ⚠️ pandas was removed in Phase 5 (PE-8). It was used in exactly one
    # place - `pd.read_sql()` on a raw mysql.connector connection, which pandas
    # does not support and warns about - and it materialised the whole register
    # twice for a file the browser downloads and the server forgets. openpyxl
    # writes the workbook directly now, in write-only mode, from a server-side
    # cursor.
    #
    # Measured, median of five cold subprocess imports on this machine:
    # `import pandas` 1.94 s, `import openpyxl` 1.43 s. Both were already
    # imported, so the saving is roughly 1.9 s of start-up, not the difference.
    # (Do not read a start-up figure off `import app` here - it is dominated by
    # OS file caching and swings between 3 s and 14 s across runs.)
    "openpyxl==3.1.5",
    "numpy==2.4.6",
    "pydantic-settings==2.15.0",

    # Phase 2 (security).
    #
    # bcrypt: password hashing and, just as importantly, verification in
    # Python. Comparing passwords inside a SQL WHERE clause let the
    # utf8mb4_general_ci collation decide authentication, which accepted
    # `ADMIN` and `admin   ` as `admin` (SE-15). See security/passwords.py.
    #
    # Flask-WTF: CSRFProtect. Chosen over a hand-rolled token because it is
    # applied globally - a POST route added later is protected without
    # anyone having to remember. It pulls in WTForms; no WTForms form
    # classes are used here.
    "bcrypt==5.0.0",
    "Flask-WTF==1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
]

[tool.setuptools]
# Flat layout: packages at the repository root, listed explicitly so setuptools
# does not try to auto-discover dataset/, trainer/, templates/ and friends.
#
# ⚠️ The note that used to sit here said Phase 5 would move all of this into
# `src/attendance/`, per todo.md §4's target tree. **It did not, and that was
# the user's decision.** MA-1's finding is about layering, not about a
# directory prefix: the split into web/ + services/ + repositories/ delivers it,
# while an src/ move would additionally rewrite every import in the tests, both
# evaluators, the scripts and this file for no measurable difference. Read §4's
# tree as a description of the layers, which now exist.
py-modules = [
    "app",
    "recognize_face",
    "train_model",
    "camera_utils",
    "face_preprocessing",
    "setup_db",
]
packages = [
    "config",
    "infra",
    "repositories",
    "security",
    "services",
    "vision",
    "web",
]


# ===========================================================================
# RUFF
# ===========================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "dataset", "trainer", "reports"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # comprehensions
    "G",    # flake8-logging-format - enforces lazy %-style logging calls
]

ignore = [
    # SIM103 "return the condition directly" fires on the last check of a
    # guard-clause chain (`if bad: return False` x4, then `return True`).
    # Taking its advice makes the final check read differently from the four
    # identical ones above it, which is harder to scan, not easier. The
    # geometry validators in vision/validation.py are built this way
    # deliberately.
    "SIM103",

    # SIM108 rewrites if/else blocks as ternaries. This codebase is written
    # in a deliberately vertical style - one argument per line, explicit
    # blocks - and the suggested one-liners run past the line limit as often
    # as not. Matching the surrounding style beats satisfying the rule.
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
# recognize_face.py falls back to a private mediapipe path when
# mp.solutions.face_mesh is unavailable, which requires an import inside an
# except block (E402). The fallback is load-bearing across mediapipe builds.
"recognize_face.py" = ["E402"]

# The evaluators print their results as a report to stdout by design - they
# are human-facing measurement harnesses, not application code, so the
# logging-format rules do not apply.
"eval_accuracy.py" = ["T201"]
"eval_heldout_accuracy.py" = ["T201"]


# ===========================================================================
# PYTEST
# ===========================================================================
[tool.pytest.ini_options]
# testpaths is what keeps pytest out of eval_*.py at collection time.
#
# ⚠️ The note that used to sit here - "nothing under tests/ may import
# recognize_face or app" - is stale and has been removed. PE-4 (Phase 3) moved
# the model load and the MediaPipe construction out of module scope, taking
# `import recognize_face` from 9.15 s to 1.57 s, and tests/conftest.py records
# the measurement and lifts the ban. Importing either module is now allowed.
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: pays for real work - trains an LBPH model, imports app, or drives the recognition loop over real frames",
    "integration: needs a running MySQL/MariaDB server and a scratch database; skipped unless INTEGRATION_DB_NAME is set (see tests/integration/conftest.py)",
]
