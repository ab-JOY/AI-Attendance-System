{% extends "base.html" %}

{% block title %}Edit Instructor{% endblock %}

{% block content %}
    <h1>Edit Instructor</h1>

    <div class="form-container">

        <!--
            Two things were broken here alongside FS-6 (app.py rendered
            "edit_instructor.html", which does not exist):

            - url_for passed `id`, but the route is
              /update_instructor/<instructor_id>, so building this URL
              raised BuildError; and
            - the form asked for `instructor.username`, a column that has
              never existed in the schema.

            Both fixed, because a route with authentication bolted onto it
            that still fails for the legitimate user is not secured.
        -->
        <form action="{{ url_for('instructors.update_instructor',
                                 instructor_id=instructor.instructor_id) }}"
              method="POST">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="instructor_id">Instructor ID</label>
            <input
                type="text"
                id="instructor_id"
                name="instructor_id"
                value="{{ instructor.instructor_id }}"
                readonly>

            <label for="fullname">Full Name</label>
            <input
                type="text"
                id="fullname"
                name="fullname"
                value="{{ instructor.fullname }}"
                required>

            <label for="department_id">Department</label>
            <select id="department_id" name="department_id">
                <option value="">Unassigned</option>
                {% for department in departments %}
                    <option value="{{ department.id }}"
                        {% if instructor.department_id == department.id %}selected{% endif %}>
                        {{ department.department_code }} - {{ department.department_name }}
                    </option>
                {% endfor %}
            </select>

            <label for="password">New Password (Optional)</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter New Password (optional)">

            <button type="submit">
                Update Instructor
            </button>

        </form>

    </div>
{% endblock %}
