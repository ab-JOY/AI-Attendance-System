<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Attendance System Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="login-page">

    <div class="login-container">

        <h1>AI-Based Facial Recognition Attendance System</h1>

        <h3>Login</h3>

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- USER TYPE -->
            <label for="roleSelect">User Type</label>
            <select
                id="roleSelect"
                name="role"
                required>
                <option value="">Select User Type</option>
                <option value="admin">Administrator</option>
                <option value="instructor">Instructor</option>
            </select>

            <!-- USERNAME / INSTRUCTOR ID -->
            <label for="user_id">Username / Instructor ID</label>
            <input
                type="text"
                id="user_id"
                name="user_id"
                placeholder="Username"
                required>

            <!-- PASSWORD -->
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

<script>

const roleSelect = document.getElementById("roleSelect");
const userField = document.getElementById("user_id");

roleSelect.addEventListener("change", function() {

    if (this.value === "admin") {
        userField.placeholder = "Username";
    }
    else if (this.value === "instructor") {
        userField.placeholder = "Instructor ID";
    }
    else {
        userField.placeholder = "Username";
    }

});

</script>

</body>
</html>
