{% extends "base.html" %}

{% block title %}Subject Management{% endblock %}

{#
    One section the subject is taught to: where it is, and when it meets.

    `n` numbers the row - `sections-<n>-program_id` and so on - and is `__N__`
    in the <template> that subjects.js copies for "Add another section".
    `chosen` is an offering to start from (`?add_to=`), or {}.
#}
{% macro section_row(n, chosen) %}
    <fieldset class="section-row" data-section-row>
        <legend>Section <span data-section-number>{{ n + 1 if n is number else '' }}</span></legend>

        {#
            DM-7. Which section the subject is taught to: a program, a year
            level and a section, the same three fields as where a student
            belongs. Type the section the way it is typed for its students:
            the class list is filled from the students of that section.
        #}
        {#
            DM-4. An instructor *account*, chosen from a list - per section,
            because one subject is often taught by several instructors: PE1 to
            BSCS 1A by one, to BSCE 1A by another. Reports, attendance and
            face capture are limited to an instructor's own offerings by this
            choice.
        #}
        <label for="sections-{{ n }}-instructor_id">Instructor</label>
        <select id="sections-{{ n }}-instructor_id" name="sections-{{ n }}-instructor_id">
            <option value="">Unassigned</option>
            {% for instructor in instructors %}
                <option value="{{ instructor.id }}"
                    {% if chosen.instructor_id == instructor.id %}selected{% endif %}>
                    {{ instructor.fullname }}
                    {% if instructor.department_code %}({{ instructor.department_code }}){% endif %}
                </option>
            {% endfor %}
        </select>

        <label for="sections-{{ n }}-program_id">Program</label>
        <select id="sections-{{ n }}-program_id" name="sections-{{ n }}-program_id" required>
            <option value="">Select Program</option>
            {% for department, offered in programs|groupby('department_name') %}
                <optgroup label="{{ department }}">
                    {% for program in offered %}
                        <option value="{{ program.id }}"
                            {% if chosen.program_id == program.id %}selected{% endif %}>
                            {{ program.program_code }} - {{ program.program_name }}
                        </option>
                    {% endfor %}
                </optgroup>
            {% endfor %}
        </select>

        <label for="sections-{{ n }}-year_level">Year Level</label>
        <select id="sections-{{ n }}-year_level" name="sections-{{ n }}-year_level" required>
            <option value="">Select Year Level</option>
            {% for year in year_levels %}
                <option value="{{ year }}"
                    {% if chosen.year_level == year %}selected{% endif %}>
                    Year {{ year }}
                </option>
            {% endfor %}
        </select>

        <label for="sections-{{ n }}-section">Section</label>
        <input
            type="text"
            id="sections-{{ n }}-section"
            name="sections-{{ n }}-section"
            maxlength="100"
            placeholder="Section"
            required>

        {% with days=[], day_field="sections-" ~ n ~ "-day" %}
            {% include "day_picker.html" %}
        {% endwith %}

        <label for="sections-{{ n }}-time_in">Time In</label>
        <input
            type="time"
            id="sections-{{ n }}-time_in"
            name="sections-{{ n }}-time_in"
            required>

        <label for="sections-{{ n }}-time_out">Time Out</label>
        <input
            type="time"
            id="sections-{{ n }}-time_out"
            name="sections-{{ n }}-time_out"
            required>

        <button type="button" data-remove-section hidden>
            Remove this section
        </button>
    </fieldset>
{% endmacro %}

{% block content %}
    <h1>Subject Management</h1>

    <!-- ================= ADD SUBJECT FORM ================= -->
    <div class="form-container" id="add">

        {% if prefill %}
            <p class="hint">
                Adding another section of {{ prefill.subject_code }}.
                <a href="{{ url_for('subjects.subjects') }}">Start a new subject instead</a>
            </p>
        {% endif %}

        <form action="{{ url_for('subjects.add_subject') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


            <label for="subject_code">Subject Code</label>
            {#
                DM-11. One code, one name. A code already in use - a minor
                subject like PE1 taught across departments - fills in its
                name, and the server refuses a second spelling.
            #}
            <input
                type="text"
                id="subject_code"
                name="subject_code"
                value="{{ prefill.subject_code or '' }}"
                placeholder="Subject Code"
                list="known-subject-codes"
                data-known-subjects="{{ known_subjects|tojson|forceescape }}"
                autocomplete="off"
                required>
            <datalist id="known-subject-codes">
                {% for code, name in known_subjects|dictsort %}
                    <option value="{{ code }}">{{ name }}</option>
                {% endfor %}
            </datalist>

            <label for="subject_name">Subject Name</label>
            <input
                type="text"
                id="subject_name"
                name="subject_name"
                value="{{ prefill.subject_name or '' }}"
                placeholder="Subject Name"
                required>
            <p class="hint" data-known-subject-hint hidden>
                An existing subject: its name is filled in. Add the sections
                below - any program, any instructor.
            </p>

            {#
                A subject is taught to one or more sections, and one offering
                is saved per section: each has its own class list, its own
                register, its own instructor, and its own days and times -
                Late is derived from them (FS-19). The code and name above are
                entered once for all of them.
            #}
            <h3>Sections taught</h3>

            <div data-section-rows>
                {{ section_row(0, prefill) }}
            </div>

            <template data-section-template>
                {{ section_row('__N__', {}) }}
            </template>

            <button type="button" data-add-section hidden>
                + Add another section
            </button>

            <button type="submit">Add Subject</button>

        </form>

    </div>

    <!-- ================= SUBJECT LIST ================= -->
    <h2 style="margin-top:30px;">Subject List</h2>

    <table class="subject-table">

        <tr>
            <th>ID</th>
            <th>Code</th>
            <th>Subject</th>
            <th>Instructor</th>
            <th>Days</th>
            <th>Program</th>
            <th>Year</th>
            <th>Section</th>
            <th>Time In</th>
            <th>Time Out</th>
            <th>Actions</th>
        </tr>

        {% for subject in subjects %}
        {#
            One heading per subject, over the sections it is taught to. The
            repository orders by code and name, so a subject's offerings are
            adjacent.
        #}
        {% if loop.changed(subject.subject_code, subject.subject_name) %}
        {% set count = subjects
            | selectattr('subject_code', 'equalto', subject.subject_code)
            | selectattr('subject_name', 'equalto', subject.subject_name)
            | list | length %}
        <tr class="subject-group">
            <td colspan="11">
                <strong>{{ subject.subject_code }} - {{ subject.subject_name }}</strong>
                <span class="hint">({{ count }} section{{ 's' if count != 1 }})</span>
                <a href="{{ url_for('subjects.subjects', add_to=subject.id) }}#add">+ Add section</a>
            </td>
        </tr>
        {% endif %}
        <tr>
            <td>{{ subject.id }}</td>
            <td>{{ subject.subject_code }}</td>
            <td>{{ subject.subject_name }}</td>
            <td>
                {{ subject.instructor_name or "Unassigned" }}
                {# A typed name with no account behind it: shown, and said so. #}
                {% if subject.instructor_name and not subject.instructor_id %}
                    <span class="hint">(no account)</span>
                {% endif %}
            </td>
            <td>{{ subject.day }}</td>
            <td>{{ subject.course or "—" }}</td>
            <td>{{ subject.year_level or "—" }}</td>
            <td>
                {{ subject.section or "—" }}
                {# Typed before the form offered a list, and matching no one
                   section: shown, and said so. Edit links it. #}
                {% if not subject.section_id %}
                    <span class="hint">(not linked)</span>
                {% endif %}
            </td>
            <td>{{ subject.time_in }}</td>
            <td>{{ subject.time_out }}</td>

            <td>
                {#
                    FS-3. Only students on a subject's class list are counted
                    when its session ends, so this link is how a subject stops
                    having an empty register.
                #}
                <a href="{{ url_for('subjects.subject_enrolments', subject_id=subject.id) }}">Class List</a> |
                <a href="{{ url_for('subjects.edit_subject', id=subject.id) }}">Edit</a> |

                <!--
                    SE-6. This was a GET link, so an <img src> or a link
                    prefetch could delete a subject. POST plus a CSRF token
                    now.
                -->
                <form
                    action="{{ url_for('subjects.delete_subject', id=subject.id) }}"
                    method="POST"
                    style="display:inline;"
                    data-confirm="Delete this section's offering of {{ subject.subject_code }}?"
                >
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <button type="submit">
                        Delete
                    </button>

                </form>
            </td>

        </tr>
        {% endfor %}

    </table>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/subjects.js') }}" defer></script>
{% endblock %}
